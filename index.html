<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gran Cassino de Marcelino</title>
<style>
  :root{
    --felt:#0b3d2b;
    --felt-deep:#062218;
    --gold:#d4af37;
    --gold-bright:#f3d773;
    --wine:#7a1230;
    --cream:#f3e9d2;
    --ink:#0a0a0a;
    --line: rgba(212,175,55,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(212,175,55,0.12), transparent 55%),
      linear-gradient(180deg, var(--felt-deep), #030a06 70%);
    color: var(--cream);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg, rgba(212,175,55,0.025) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(-45deg, rgba(212,175,55,0.025) 0 2px, transparent 2px 22px);
    z-index:0;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 20px 6px;
    position:relative; z-index:1;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-weight:700; letter-spacing:0.06em; font-size:12px;
    text-transform:uppercase;
    color: var(--gold-bright);
  }
  .brand .suit{ font-size:14px; }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6px 20px 30px;
    max-width:480px;
    margin:0 auto;
    width:100%;
    position:relative; z-index:1;
  }

  .screen{ width:100%; display:none; flex-direction:column; align-items:center; }
  .screen.active{ display:flex; }

  /* ---- marco simple con borde dorado — SOLO se usa para la foto final,
     pequeña y compacta, no para la vista de cámara (esa va a pantalla
     completa, ver .camera-screen más abajo). Mantiene proporción 9:16,
     el formato correcto para Stories, aunque se vea pequeño en pantalla. */
  .frame{
    width: 58%;
    max-width: 260px;
    margin: 0 auto;
    aspect-ratio: 9/16;
    border-radius:16px;
    position:relative;
    overflow:hidden;
    background: #04120b;
    border: 3px solid var(--gold);
  }
  #reviewCanvas{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---- Screen: intro — solo texto, sin cuadro visual ---- */
  .intro-suits{
    font-size:32px;
    letter-spacing:16px;
    color: rgba(212,175,55,0.55);
    text-align:center;
    margin-bottom:6px;
  }
  h1{
    font-size: 26px;
    line-height:1.2;
    font-weight:700;
    margin: 10px 0 8px;
    text-align:center;
    color: var(--gold-bright);
    letter-spacing:0.01em;
  }
  p.sub{
    text-align:center;
    color: rgba(243,233,210,0.65);
    font-size:14px;
    line-height:1.55;
    margin:0 0 26px;
    max-width: 34ch;
    font-family: system-ui, sans-serif;
  }

  button{
    font-family: system-ui, sans-serif;
    border:none;
    cursor:pointer;
  }
  .btn-main{
    width:100%;
    padding:16px;
    border-radius:10px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a03;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    box-shadow: 0 8px 18px rgba(212,175,55,0.25);
    transition: transform 0.15s ease;
  }
  .btn-main:active{ transform: scale(0.97); }
  .btn-ghost{
    width:100%;
    padding:14px;
    border-radius:10px;
    background: transparent;
    border:1.5px solid var(--line);
    color: var(--cream);
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin-top:10px;
  }
  .btn-ghost:active{ transform: scale(0.98); }

  /* =====================================================================
     PANTALLA DE CÁMARA — A PANTALLA COMPLETA (como una app de selfies)
     Es un elemento independiente, fuera de <main>, en position:fixed
     cubriendo toda la pantalla. Así el vídeo llena el móvil entero y
     el botón de disparo flota encima, no hay scroll ni recuadros.
     ===================================================================== */
  .camera-screen{
    display:none;
    position:fixed; inset:0;
    z-index:40;
    background:#000;
    overflow:hidden;
  }
  .camera-screen.active{ display:block; }
  .camera-screen video{
    width:100%; height:100%; object-fit:cover; display:block;
    transform: scaleX(-1);
  }

  /* RÓTULO EN VIVO sobre el vídeo — esto es lo que se ve mientras encuadras
     y se hornea en la foto final tal cual. Cambia el texto aquí, y aquí
     mismo puedes meter <img> de fichas de póker a los lados o el logo
     del casino sustituyendo el texto. */
  .live-nameplate{
    position:absolute;
    left:0; right:0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 130px);
    padding: 0 10%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    z-index:2;
    pointer-events:none;
  }
  /* sitio reservado para fichas de póker a cada lado (descomenta las <img>
     en el HTML y ajusta el tamaño aquí) */
  .live-nameplate .chip{
    width: 15%;
    max-width:48px;
    height:auto;
    flex: 0 0 auto;
  }
  .live-nameplate .txt{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-weight:700;
    font-size: clamp(20px, 6vw, 30px);
    line-height:1.15;
    text-align:center;
    color: #f3d773;
    text-shadow: 0 0 14px rgba(212,175,55,0.85), 0 2px 6px rgba(0,0,0,0.8);
  }
  /* Logo del casino en la vista previa en vivo — se dibuja tal cual también
     en la foto final (ver LOGO_SRC / drawNamePlate en el JS). Si el logo se
     ve muy grande o pequeño, ajusta este max-width. */
  .live-nameplate .logo-img{
    width: 78%;
    max-width: 320px;
    height:auto;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.55));
  }

  .cam-hint{
    position:absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left:0; right:0;
    text-align:center;
    font-size:11.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color: var(--gold-bright);
    background: rgba(4,18,11,0.55);
    backdrop-filter: blur(4px);
    padding:6px 14px;
    width:fit-content;
    margin:0 auto;
    border-radius:100px;
    border:1px solid var(--line);
    font-family: system-ui, sans-serif;
    z-index:2;
  }
  .countdown{
    position:absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left:14px;
    display:none;
    align-items:center; justify-content:center;
    width:44px; height:44px;
    border-radius:50%;
    background: rgba(4,18,11,0.65);
    border: 1.5px solid var(--line);
    backdrop-filter: blur(3px);
    z-index:3;
  }
  .countdown.active{ display:flex; }
  .countdown-num{
    font-size:20px;
    font-weight:700;
    color: var(--gold-bright);
    font-family: Georgia, serif;
  }
  .cam-error{
    position:absolute; left:20px; right:20px;
    top: calc(env(safe-area-inset-top, 0px) + 60px);
    font-size:13px; color:#ffb4a8; text-align:center; display:none;
    font-family: system-ui, sans-serif;
    background: rgba(0,0,0,0.5);
    padding:10px 14px; border-radius:10px;
    z-index:3;
  }
  .shutter-dock{
    position:absolute;
    left:0; right:0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    display:flex; align-items:center; justify-content:center;
    z-index:3;
  }
  .shutter{
    width:74px; height:74px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #7a5c10 100%);
    border: 3px solid rgba(243,233,210,0.55);
    box-shadow: 0 0 22px rgba(212,175,55,0.55);
  }
  .shutter:active{ transform: scale(0.94); }

  /* ---- Screen: review ---- */
  .result-actions{
    width:100%;
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  a.btn-main{
    display:block;
    text-align:center;
    text-decoration:none;
  }

  .footnote{
    font-size:11px;
    color: rgba(243,233,210,0.35);
    text-align:center;
    margin-top:16px;
    line-height:1.5;
    font-family: system-ui, sans-serif;
  }

  canvas.hidden-proc{ display:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="suit">♠</span>Gran Cassino de Marcelino</div>
</div>

<main>

  <!-- SCREEN 1: INTRO — solo texto y un botón -->
  <section class="screen active" id="screen-intro">
    <div class="intro-suits">♠ ♥ ♦ ♣</div>
    <h1>Las cartas ya están marcadas</h1>
    <p class="sub">Los astros se han alineado: inmortaliza el momento antes de que la noche te deje sin un solo doblón que apostar.</p>
    <button class="btn-main" id="btnStart">Tentar a la suerte</button>
  </section>

  <!-- SCREEN 3: REVIEW / FOTO EN PEQUEÑO -->
  <section class="screen" id="screen-review">
    <div class="frame">
      <canvas id="reviewCanvas" width="1080" height="1920"></canvas>
    </div>
    <div class="result-actions">
      <a class="btn-main" id="btnDownload" download="gran-cassino-de-marcelino.png">Llévate el recuerdo</a>
      <button class="btn-ghost" id="btnAnother">Otra tirada</button>
    </div>
    <p class="footnote">Ven con suerte. Vete como puedas.</p>
  </section>

</main>

<!-- SCREEN 2: CÁMARA A PANTALLA COMPLETA (fuera de <main> a propósito) -->

  <video id="liveVideo" autoplay playsinline muted></video>

<canvas id="captureCanvas" class="hidden-proc"></canvas>

<script>
(function(){
  const screens = {
    intro: document.getElementById('screen-intro'),
    camera: document.getElementById('screen-camera'),
    review: document.getElementById('screen-review'),
  };

  function goTo(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    if(name === 'camera') startCamera();
    else stopCamera();
  }

  // ---------- CAMERA ----------
  const video = document.getElementById('liveVideo');
  const camError = document.getElementById('camError');
  let stream = null;

  async function startCamera(){
    camError.style.display = 'none';
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1920 } },
        audio: false
      });
      video.srcObject = stream;
    }catch(err){
      camError.style.display = 'block';
      camError.textContent = 'No se pudo acceder a la cámara (' + err.message + '). Ábrelo directamente en el navegador del móvil y acepta el permiso de cámara.';
    }
  }
  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  // ---------- CAPTURE + OVERLAY ----------
  const captureCanvas = document.getElementById('captureCanvas');

  // ==========================================================================
  // TEXTO QUE SE HORNEA EN LA FOTO FINAL — cámbialo aquí.
  // Debe coincidir con el texto que ves en vivo en el HTML (.live-nameplate .txt)
  // para que la vista previa y la foto final digan lo mismo.
  // ==========================================================================
  const CASINO_NAME = 'GRAN CASSINO DE MARCELINO';

  function drawNamePlate(ctx, W, H){
    const plateY = H * 0.80;
    const pad = Math.round(W*0.08);

    // ---- SITIO PARA LAS FICHAS DE PÓKER (a izquierda y derecha del logo) ----
    // ctx.drawImage(imgFichaIzq, pad, plateY, chipSize, chipSize);
    // ctx.drawImage(imgFichaDer, W - pad - chipSize, plateY, chipSize, chipSize);

    const logoImg = document.getElementById('liveLogoImg');
    if(logoImg && logoImg.complete && logoImg.naturalWidth > 0){
      // logo real (mismo que se ve en vivo), centrado, tamaño proporcional
      const maxLogoW = (W - pad*2) * 0.78;
      const scale = maxLogoW / logoImg.naturalWidth;
      const logoW = logoImg.naturalWidth * scale;
      const logoH = logoImg.naturalHeight * scale;
      const cx = W/2;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = W * 0.015;
      ctx.drawImage(logoImg, cx - logoW/2, plateY - logoH/2, logoW, logoH);
      ctx.restore();
    } else {
      // reserva: si el logo no ha cargado a tiempo, se dibuja el texto
      const fontSize = Math.round(W * 0.058);
      ctx.font = '700 ' + fontSize + 'px Georgia, "Iowan Old Style", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(212,175,55,0.85)';
      ctx.shadowBlur = fontSize * 0.35;
      ctx.fillStyle = '#f3d773';
      wrapCenteredText(ctx, CASINO_NAME, W/2, plateY, W - pad*2, fontSize*1.15);
      ctx.shadowBlur = 0;
    }
  }

  // simple centered multi-line wrap
  function wrapCenteredText(ctx, text, cx, cy, maxWidth, lineHeight){
    const words = text.split(' ');
    let lines = [];
    let current = '';
    for(const w of words){
      const test = current ? current + ' ' + w : w;
      if(ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    }
    if(current) lines.push(current);
    const totalH = lines.length * lineHeight;
    let y = cy - totalH/2 + lineHeight/2;
    for(const line of lines){
      ctx.fillText(line, cx, y);
      y += lineHeight;
    }
  }

  // ==========================================================================
  // FORMATO DE LA FOTO — 1080x1920 (9:16) es el tamaño estándar para subir
  // a Historias de Instagram/WhatsApp sin que se recorte raro. Si algún día
  // quieres formato cuadrado o de post normal, cambia esto (p.ej. 1080x1080).
  // ==========================================================================
  const OUTPUT_W = 1080, OUTPUT_H = 1920;

  function renderToCanvas(targetCanvas){
    const W = OUTPUT_W, H = OUTPUT_H;
    targetCanvas.width = W;
    targetCanvas.height = H;
    const ctx = targetCanvas.getContext('2d');
    ctx.drawImage(captureCanvas, 0, 0, W, H);
    drawNamePlate(ctx, W, H);
  }

  let pendingBlob = null;
  let countdownRunning = false;

  function doCapture(){
    const W = OUTPUT_W, H = OUTPUT_H;
    captureCanvas.width = W;
    captureCanvas.height = H;
    const ctx = captureCanvas.getContext('2d');
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    const vw = video.videoWidth, vh = video.videoHeight;
    const targetRatio = W / H;
    const srcRatio = vw / vh;
    let sx, sy, sw, sh;
    if(srcRatio > targetRatio){
      sh = vh; sw = vh * targetRatio; sx = (vw - sw)/2; sy = 0;
    } else {
      sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh)/2;
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
    ctx.setTransform(1,0,0,1,0,0);

    const reviewCanvas = document.getElementById('reviewCanvas');
    renderToCanvas(reviewCanvas);

    reviewCanvas.toBlob(blob => {
      pendingBlob = blob;
      document.getElementById('btnDownload').href = URL.createObjectURL(blob);
    }, 'image/png');

    goTo('review');
  }

  document.getElementById('btnShutter').addEventListener('click', () => {
    if(countdownRunning) return;
    countdownRunning = true;

    const camHint = document.getElementById('camHint');
    const countdownEl = document.getElementById('countdown');
    const countdownNum = document.getElementById('countdownNum');

    camHint.style.display = 'none';
    countdownEl.classList.add('active');

    let n = 5;
    countdownNum.textContent = n;
    const timer = setInterval(() => {
      n -= 1;
      if(n > 0){
        countdownNum.textContent = n;
      } else {
        clearInterval(timer);
        countdownEl.classList.remove('active');
        camHint.style.display = '';
        countdownRunning = false;
        doCapture();
      }
    }, 1000);
  });

  // ---------- NAV ----------
  document.getElementById('btnStart').addEventListener('click', () => goTo('camera'));
  document.getElementById('btnAnother').addEventListener('click', () => goTo('camera'));

})();
</script>

</body>
</html>
